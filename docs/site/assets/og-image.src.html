<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zero Layer — social preview</title>
<!-- Source for og-image.png. Regenerate with a 1200x630 screenshot, e.g.
     npx playwright screenshot --viewport-size=1200,630 assets/og-image.src.html og-image.png -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&amp;family=Geist+Mono:wght@400..500&amp;display=swap">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: #0b0c0a; color: #eceee6; font-family: "Geist Mono", monospace;
        padding: 64px 72px;
    }
    body::before {
        content: ""; position: absolute; inset: 0;
        background-image: linear-gradient(rgba(236,240,226,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(236,240,226,.05) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 80% 90% at 20% 0%, #000 30%, transparent 80%);
    }
    .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 14px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
    .brand svg { width: 44px; height: 44px; }
    .tag { font-size: 18px; color: #969c8c; border: 1px solid rgba(236,240,226,.18); border-radius: 8px; padding: 6px 14px; }
    h1 { position: relative; margin-top: 70px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 750; font-size: 96px; line-height: .95; letter-spacing: -0.035em; white-space: nowrap; }
    h1 span { display: block; }
    h1 .b { color: #969c8c; }
    h1 .b::after { content: ""; display: inline-block; width: 40px; height: 74px; margin-left: 8px; background: #c8f560; vertical-align: -6px; }
    .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; font-size: 21px; color: #aeb3a4; }
    .foot b { color: #c8f560; font-weight: 500; }
</style>
</head>
<body>
    <div class="top">
        <div class="brand">
            <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#c8f560"/><path d="M9.5 10.5h12l-11 11h12" fill="none" stroke="#0b0c0a" stroke-width="3" stroke-linecap="square"/></svg>
            Zero Layer
        </div>
        <span class="tag">open source · MIT · Rust</span>
    </div>
    <h1><span>One command.</span><span class="b">Any package. Any distro.</span></h1>
    <div class="foot">
        <span><b>$</b> zl install anything</span>
        <span>13 sources · 0 containers · 0 ms overhead</span>
    </div>
</body>
</html>
